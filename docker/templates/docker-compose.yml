# RadioRing - compose template
#
# Written into the target directory by install.sh. The file is deliberately
# invariant: which services run is decided by COMPOSE_PROFILES in the .env next
# to it. That is far more robust than cutting blocks out of a file.
#
# Profiles:
#   driver-docker   Socket proxy for container control (CONTAINER_DRIVER=docker)
#   bundled-db      Ship MySQL instead of connecting to an external one
#   bundled-redis   Ship Redis instead of connecting to an external one
#   traefik         Ship a reverse proxy instead of using an existing one
#
# SECURITY: anyone who reaches the Docker API can start a privileged container
# with the host root mounted, and is root on the host from there. The socket
# proxy reduces the attack surface, it is NOT a security boundary.
# See SECURITY.md.

services:
  app:
    image: ${RADIORING_IMAGE:?Set RADIORING_IMAGE}
    restart: unless-stopped
    init: true
    # A single source for every value. Keeps the .env and an enumerated
    # environment block from drifting apart over time.
    env_file: [.env]
    networks: [radioring, web]
    # Loopback only by default. With Traefik this is merely a way in for
    # debugging; without a reverse proxy it is the only way in (reachable
    # through an SSH tunnel then, or widen APP_BIND deliberately).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.docker.network=${WEB_NETWORK:-radioring-web}
      - traefik.http.routers.radioring.rule=Host(`${APP_HOST:?Set APP_HOST}`)
      - traefik.http.routers.radioring.entrypoints=websecure
      - traefik.http.routers.radioring.tls.certresolver=${TRAEFIK_CERTRESOLVER:-radioring}
      - traefik.http.services.radioring.loadbalancer.server.port=8080

  # Hands the app exactly the Docker endpoints it needs.
  # No ports: on purpose - reachable on the internal network only.
  dockerproxy:
    profiles: [driver-docker]
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      # :ro is cosmetic - a Unix socket is bidirectional, read-only applies to the inode.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [radioring]

  mysql:
    profiles: [bundled-db]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    networks: [radioring]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    profiles: [bundled-redis]
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    networks: [radioring]

  traefik:
    profiles: [traefik]
    # Do not go below v3.6: earlier versions pin the Docker API to 1.24, which
    # newer engines reject, and Traefik then sees no containers at all.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://dockerproxy-traefik:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.radioring.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.radioring.acme.storage=/acme/acme.json
      - --certificatesresolvers.radioring.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/acme
    networks: [radioring, web]

  # Traefik gets its OWN, genuinely read-only proxy. Neither the socket itself
  # nor the app's proxy, which has to allow POST.
  dockerproxy-traefik:
    profiles: [traefik]
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [radioring]

networks:
  # Explicit name: otherwise the network name depends on the installation
  # directory (<project>_default) and DOCKER_STATION_NETWORK points nowhere.
  radioring:
    name: radioring
  web:
    name: ${WEB_NETWORK:-radioring-web}
    external: ${WEB_NETWORK_EXTERNAL:-false}

volumes:
  storage:
  mysql:
  redis:
  acme:

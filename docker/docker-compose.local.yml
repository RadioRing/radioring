# Lokales Test-Setup: Icecast + ein RadioRing-Station-Container.
#
# Einfachster Weg:  ./docker/run-local.ps1   (macht alles automatisch)
#
# Manuell:
#   1. php artisan radioring:prepare-local-stream   (schreibt docker/.env)
#   2. php artisan serve --host=0.0.0.0 --port=8000
#   3. docker compose --env-file docker/.env -f docker/docker-compose.local.yml up --build
#
# Hören:  http://localhost:8010/<slug>   (z.B. in VLC)
#
# Hinweis: Icecast liegt auf Host-Port 8010, damit es nicht mit der Laravel-App
# (Port 8000) kollidiert. Im Docker-Netzwerk spricht der Station-Container
# Icecast intern weiterhin über icecast:8000 an.

services:
  icecast:
    image: libretime/icecast:2.4.4
    ports:
      - "8010:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: hackme
      ICECAST_ADMIN_PASSWORD: hackme
      ICECAST_RELAY_PASSWORD: hackme
      ICECAST_PASSWORD: hackme
      ICECAST_HOSTNAME: localhost

  station:
    build:
      context: ./liquidsoap-station
    depends_on:
      - icecast
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_URL: "${LIQUIDSOAP_API_URL:-http://host.docker.internal:8000}"
      SLUG: "${STATION_SLUG:?Set STATION_SLUG}"
      TOKEN: "${STATION_TOKEN:?Set STATION_TOKEN}"
      SCRIPT_REFRESH: "true"
      # Redis-Relay (Skip/Stop/Restart aus dem Dashboard) – Werte aus Laravels Config,
      # geschrieben von radioring:prepare-local-stream.
      CONTAINER_NAME: "${CONTAINER_NAME:-radioring-${STATION_SLUG}}"
      CONTROL_CHANNEL: "${CONTROL_CHANNEL:-radioring_station_control}"
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"

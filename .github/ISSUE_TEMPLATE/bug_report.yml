name: Bug report
description: Something behaves differently than documented or expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Security issues do not belong here**, please report
        them privately through Security → Advisories. See `SECURITY.md`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
      placeholder: |
        Expected: the station keeps playing after the hour boundary.
        Actual: it falls silent at the top of the hour.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The shortest path you know that triggers it.
      placeholder: |
        1. Create a playlist with a fill element
        2. Assign it to the 14:00 slot
        3. Generate the rundown
        4. Start the container
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit. `docker compose images` shows the tag.
      placeholder: "ghcr.io/radioring/radioring:latest, digest sha256:..."
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options:
        - standalone
        - cloud
        - not sure
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: Container driver
      description: From CONTAINER_DRIVER in your .env
      options:
        - docker via socket proxy
        - docker via mounted socket
        - portainer
        - not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Usually `docker compose logs --tail=100 app`. For playout problems the station
        container helps too: `docker logs radioring-<slug>`.

        Please remove tokens and passwords before pasting.
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Anything that might matter.
      placeholder: |
        Host: Debian 12, arm64
        Reverse proxy: bundled Traefik
        Database: bundled MySQL
        Installed via: install.sh

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The queue worker and scheduler are running (silence and stuck containers are usually caused by neither running)
        - label: I have removed secrets from the logs above

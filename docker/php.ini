[PHP]
; Großzügige Limits – greift für FrankenPHP (conf.d wird nach php.ini geladen).
; Uploads laufen zwar chunked (4 MB/Chunk), die Limits decken aber auch
; größere Einzel-Requests und die Assemblierung großer Dateien ab.
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 50
max_execution_time = 300
max_input_time = 300

[opcache]
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1

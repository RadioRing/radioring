name: Feature request
description: Suggest something RadioRing should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        Describe the situation, not the solution. What are you trying to achieve on air,
        and where does RadioRing get in the way today?
      placeholder: |
        We want a jingle before every news block, but only on weekdays. Today we would
        have to build a second playlist and maintain both in parallel.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work
      description: Optional. If you already have an idea, describe it here.

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead
      description: Optional, but it helps to judge how much this hurts.

name: Build & Push Docker Image

# Continuous builds from main produce "edge". Release builds are driven by
# release.yml, which calls this workflow on a version tag; the tag context then
# makes metadata-action emit the semver tags plus "latest".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # flavor latest=auto (the default) adds "latest" whenever a semver tag
          # is produced, so "latest" tracks releases and "edge" tracks main.
          tags: |
            # Rolling build of the default branch
            type=raw,value=edge,enable={{is_default_branch}}
            # Version tags from git tags (v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Short SHA for every build
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # The demo tracks edge, so a release tag must not redeploy it. Without the
  # ref check this would also fire when release.yml calls the workflow, because
  # a tag push is a push event too.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Portainer redeploy
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          # The secret only exists in the repository that runs the demo. In forks
          # and in a public repository without a demo the step skips itself
          # quietly instead of turning the build red.
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set - deploy skipped."
            exit 0
          fi

          curl -fsS -X POST "$WEBHOOK"
          echo "Portainer redeploy triggered."

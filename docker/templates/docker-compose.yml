# RadioRing - Compose-Template
#
# Wird von install.sh in das Zielverzeichnis geschrieben. Die Datei ist bewusst
# unveraenderlich: welche Dienste laufen, steuert COMPOSE_PROFILES in der .env
# daneben. Das ist deutlich robuster, als Bloecke aus einer Datei zu schneiden.
#
# Profile:
#   driver-docker   Socket-Proxy fuer die Container-Steuerung (CONTAINER_DRIVER=docker)
#   bundled-db      MySQL mitliefern statt extern anbinden
#   bundled-redis   Redis mitliefern statt extern anbinden
#   traefik         Reverse Proxy mitliefern statt vorhandenen nutzen
#
# SICHERHEIT: Wer die Docker-API erreicht, kann einen privilegierten Container mit
# gemountetem Host-Root starten und ist damit root auf dem Host. Der Socket-Proxy
# verkleinert die Angriffsflaeche, er ist KEINE Sicherheitsgrenze. Siehe SECURITY.md.

services:
  app:
    image: ${RADIORING_IMAGE:?Set RADIORING_IMAGE}
    restart: unless-stopped
    init: true
    # Eine einzige Quelle fuer alle Werte. Verhindert das staendige Auseinanderlaufen
    # von .env und einem aufgezaehlten environment-Block.
    env_file: [.env]
    networks: [radioring, web]
    # Standardmaessig nur auf dem Loopback. Mit Traefik ist das lediglich ein Zugang
    # zur Fehlersuche; ohne Reverse Proxy ist es der einzige Weg hinein (dann per
    # SSH-Tunnel erreichbar, oder APP_BIND bewusst weiten).
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.docker.network=${WEB_NETWORK:-radioring-web}
      - traefik.http.routers.radioring.rule=Host(`${APP_HOST:?Set APP_HOST}`)
      - traefik.http.routers.radioring.entrypoints=websecure
      - traefik.http.routers.radioring.tls.certresolver=${TRAEFIK_CERTRESOLVER:-radioring}
      - traefik.http.services.radioring.loadbalancer.server.port=8080

  # Vermittelt der App genau die Docker-Endpunkte, die sie braucht.
  # Bewusst KEIN ports: - nur im internen Netz erreichbar.
  dockerproxy:
    profiles: [driver-docker]
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      # :ro ist kosmetisch - ein Unix-Socket ist bidirektional, read-only gilt der Inode.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [radioring]

  mysql:
    profiles: [bundled-db]
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    networks: [radioring]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    profiles: [bundled-redis]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis:/data
    networks: [radioring]

  traefik:
    profiles: [traefik]
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://dockerproxy-traefik:2375
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.radioring.acme.email=${ACME_EMAIL:?Set ACME_EMAIL}
      - --certificatesresolvers.radioring.acme.storage=/acme/acme.json
      - --certificatesresolvers.radioring.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme:/acme
    networks: [radioring, web]

  # Traefik bekommt einen EIGENEN, echt lesenden Proxy. Weder den Socket direkt noch
  # den Proxy der App, der POST erlauben muss.
  dockerproxy-traefik:
    profiles: [traefik]
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [radioring]

networks:
  # Expliziter name: sonst haengt der Netzname vom Installationsverzeichnis ab
  # (<projekt>_default) und DOCKER_STATION_NETWORK zeigt ins Leere.
  radioring:
    name: radioring
  web:
    name: ${WEB_NETWORK:-radioring-web}
    external: ${WEB_NETWORK_EXTERNAL:-false}

volumes:
  storage:
  mysql:
  redis:
  acme:

name: Release

# A release is one git tag that produces four things which have to match: the
# app image, the station image, the Icecast image and the compose template
# install.sh fetches from the same tag. The images are built from here rather than from a tag trigger on
# the image workflows, so that nothing depends on how GitHub evaluates a paths
# filter on a tag push.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, for example v1.2.0'
        required: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    uses: ./.github/workflows/tests.yml

  # Fails before any image is built, because a release without notes is not one.
  notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: The changelog has a section for this tag
        run: sh .github/scripts/changelog-section.sh "${{ github.event.inputs.tag || github.ref_name }}"

  app-image:
    needs: [lint, tests, notes]
    permissions:
      contents: read
      packages: write
    secrets: inherit
    uses: ./.github/workflows/docker.yml

  station-image:
    needs: [lint, tests, notes]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/liquidsoap-station.yml

  icecast-image:
    needs: [lint, tests, notes]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/icecast.yml

  verify:
    needs: [app-image, station-image, icecast-image]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: All images exist for both architectures
        env:
          VERSION: ${{ steps.v.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          failed=0

          for image in "ghcr.io/${owner}/radioring:${VERSION}" \
                       "ghcr.io/${owner}/liquidsoap-station:${VERSION}" \
                       "ghcr.io/${owner}/icecast:${VERSION}"; do
            if ! manifest="$(docker manifest inspect "$image" 2>/dev/null)"; then
              echo "MISSING $image"
              failed=1
              continue
            fi

            for arch in amd64 arm64; do
              if echo "$manifest" | grep -q "\"architecture\": \"$arch\""; then
                echo "ok      $image ($arch)"
              else
                echo "MISSING $image ($arch)"
                failed=1
              fi
            done
          done

          exit "$failed"

      - name: Checkout
        uses: actions/checkout@v4

      # install.sh pins the images to this tag and pulls the template from it,
      # so the template at the tag has to stand on its own.
      - name: The compose template at this tag parses
        run: |
          workdir="$(mktemp -d)"
          cp docker/templates/docker-compose.yml "$workdir/docker-compose.yml"

          cat > "$workdir/.env" <<'ENVEOF'
          RADIORING_IMAGE=ghcr.io/radioring/radioring:latest
          APP_HOST=panel.example.com
          DB_DATABASE=radioring
          DB_USERNAME=radioring
          DB_PASSWORD=secret
          DB_ROOT_PASSWORD=rootsecret
          REDIS_PASSWORD=secret
          ACME_EMAIL=admin@example.com
          WEB_NETWORK=radioring-web
          ENVEOF

          cd "$workdir"
          docker compose config --quiet
          COMPOSE_PROFILES=driver-docker,bundled-db,bundled-redis,traefik \
            docker compose config --quiet

  # The changelog is the single source of the release notes, so the page on GitHub
  # and the file in the repository cannot drift apart.
  publish:
    needs: [verify]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish the release with its changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sh .github/scripts/changelog-section.sh "$TAG" > notes.md

          # The whole 0.x line is a prerelease: update.sh treats it as such, and
          # /releases/latest must not start pointing at it by accident.
          prerelease=""
          case "${TAG#v}" in
              0.*) prerelease="--prerelease" ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" --notes-file notes.md
          else
              # shellcheck disable=SC2086
              gh release create "$TAG" --title "$TAG" --notes-file notes.md $prerelease
          fi
